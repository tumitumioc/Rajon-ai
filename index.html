<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রিডাইরেক্ট করা হচ্ছে...</title>
  <style>
    body {
      margin: 0; padding: 0;
      background: #0f172a; color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; text-align: center;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid #334155;
      border-top: 4px solid #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { font-size: 19px; margin: 0 0 8px 0; }
    p { font-size: 14px; color: #94a3b8; margin: 0; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>এক সেকেন্ড অপেক্ষা করুন...</h2>
  <p>আপনাকে পেজে নিয়ে যাওয়া হচ্ছে</p>

  <script>
    (async function() {
      const SUPABASE_URL = "https://idaauircnxuoulinacrq.supabase.co";
      const SUPABASE_KEY = "sb_publishable_2pu2FVebvHlVP0Kqoe2YmQ_sBN8n2tj";

      const urlParams = new URLSearchParams(window.location.search);
      let shortCode = urlParams.get('c') || urlParams.get('code') || urlParams.get('go');
      
      if (!shortCode) {
        const pathPart = window.location.pathname.replace(/^\/+/, '').split('/')[0];
        const hashPart = window.location.hash.replace(/^#/, '');
        shortCode = hashPart || pathPart;
      }

      if (!shortCode || shortCode === 'index.html') {
        document.body.innerHTML = "<h2>কোনো লিংক কোড পাওয়া যায়নি!</h2><p>অনুগ্রহ করে সঠিক মার্কেটিং লিংক ব্যবহার করুন।</p>";
        return;
      }

      try {
        const res = await fetch(
          SUPABASE_URL + '/rest/v1/short_urls?short_code=eq.' + encodeURIComponent(shortCode) + '&select=id,target_url,clicks',
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: 'Bearer ' + SUPABASE_KEY
            }
          }
        );

        const rows = await res.json();
        if (!rows || rows.length === 0) {
          document.body.innerHTML = "<h2>লিংকটি পাওয়া যায়নি বা মেয়াদ শেষ হয়ে গেছে!</h2>";
          return;
        }

        const targetUrl = rows[0].target_url;
        const linkId = rows[0].id;
        const currentClicks = rows[0].clicks || 0;

        const ua = navigator.userAgent || '';
        const isWebDriver = !!navigator.webdriver;
        const isBotUa = /bot|crawl|spider|slurp|facebookexternalhit|whatsapp|telegrambot|discordbot|preview|headless|curl|python/i.test(ua);
        const hasFakeScreen = window.screen.width === 0 || window.screen.height === 0;
        const isBasicBot = isWebDriver || isBotUa || hasFakeScreen;

        // ৪. অ্যান্টি-স্প্যাম ও ইউনিক ভিজিটর ডিটেকশন (২৪ ঘণ্টার ভেতর বারবার ক্লিক রোধ)
        const storageKey = 'v_uniq_' + encodeURIComponent(shortCode);
        let isRepeatClick = false;
        try {
          const lastVisit = localStorage.getItem(storageKey);
          const now = Date.now();
          const COOLDOWN_MS = 24 * 60 * 60 * 1000;
          if (lastVisit && (now - parseInt(lastVisit, 10)) < COOLDOWN_MS) {
            isRepeatClick = true;
          } else {
            localStorage.setItem(storageKey, now.toString());
          }
        } catch(e) {}

        const isBotOrSpam = isBasicBot || isRepeatClick;

        let deviceType = 'desktop';
        if (/mobile|android|iphone|ipad|phone/i.test(ua)) deviceType = 'mobile';
        else if (/tablet/i.test(ua)) deviceType = 'tablet';
        if (isRepeatClick) deviceType = 'repeat_visit';
        if (isBasicBot) deviceType = 'bot';

        let browserName = 'Other';
        if (isRepeatClick) browserName = 'Duplicate Click';
        else if (isBasicBot) browserName = 'Bot / Automation';
        else if (ua.includes('Chrome')) browserName = 'Chrome';
        else if (ua.includes('Safari')) browserName = 'Safari';
        else if (ua.includes('Firefox')) browserName = 'Firefox';
        else if (ua.includes('Edge')) browserName = 'Edge';

        const referrer = document.referrer || 'Direct / Group Share';

        fetch(SUPABASE_URL + '/rest/v1/click_events', {
          method: 'POST',
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            short_code: shortCode,
            device_type: deviceType,
            browser: browserName,
            referrer: referrer,
            is_bot: isBotOrSpam
          })
        }).catch(function() {});

        // শুধুমাত্র সত্যিকারের ইউনিক ভিজিটর হলেই মোট কাউন্টার বাড়ানো হবে!
        if (!isBotOrSpam) {
          fetch(SUPABASE_URL + '/rest/v1/short_urls?id=eq.' + linkId, {
            method: 'PATCH',
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: 'Bearer ' + SUPABASE_KEY,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ clicks: currentClicks + 1 })
          }).catch(function() {});
        }

        window.location.replace(targetUrl);

      } catch (err) {
        document.body.innerHTML = "<h2>ত্রুটি:</h2><p>" + err.message + "</p>";
      }
    })();
  </script>
</body>
</html>
